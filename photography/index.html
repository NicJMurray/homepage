    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Photos — Nic Murray</title>
    <meta
      name="description"
      content="A personal collection of photographs by Nic Murray."
    />
    <meta property="og:title" content="My Photos — Nic Murray" />
    <meta
      property="og:description"
      content="A personal collection of photographs by Nic Murray."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://njmurray.com/photography/og.jpg" />

    <link rel="canonical" href="https://njmurray.com/photography/" />
    <link rel="stylesheet" href="photography.css" />
  </head>

  <body>
    <header class="photo-header">
      <h1>My Photos</h1>
      <a class="back-link" href="/" aria-label="Back to homepage">
        <span aria-hidden="true">↖</span>
      </a>
    </header>

    <main>
      <div class="gallery" id="gallery" aria-live="polite"></div>
      <p class="sr-only" id="gallery-status" role="status"></p>
    </main>

    <dialog class="lightbox" id="lightbox" aria-label="Fullscreen photograph">
      <div class="lightbox__stage">
        <button class="lightbox__close" type="button" aria-label="Close fullscreen photograph">
          <span aria-hidden="true">×</span>
        </button>

        <button class="lightbox__nav lightbox__nav--previous" type="button" aria-label="Previous photograph">
          <span aria-hidden="true">←</span>
        </button>

        <img src="" alt="" />

        <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Next photograph">
          <span aria-hidden="true">→</span>
        </button>
      </div>
    </dialog>

    <script src="gallery.js" defer></script>
  </body>
</html>
