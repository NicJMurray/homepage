    <header class="site-header">
      <a class="wordmark" href="/" aria-label="Back to njmurray homepage">
        <span class="mark" aria-hidden="true">N</span>
        <span>njmurray</span>
      </a>

      <nav aria-label="Photography navigation">
        <a href="#collection">Collection</a>
        <a href="/" class="home-link">
          All projects
          <span aria-hidden="true">↗</span>
        </a>
      </nav>
    </header>

    <main>
      <section class="collection" id="collection" aria-labelledby="collection-title">
        <div class="collection__head">
          <h1 id="collection-title">My Photos</h1>
        </div>

        <div class="gallery" id="gallery" aria-live="polite">
          <p class="gallery__loading">Preparing the photographs…</p>
        </div>

        <noscript>
          <p class="noscript-message">
            JavaScript is needed to assemble this gallery and open the fullscreen viewer.
          </p>
        </noscript>
      </section>

    </main>

    <footer>
      <p>&copy; <span id="year"></span> Nic Murray</p>
      <a href="https://github.com/NicJMurray" rel="noopener" target="_blank">GitHub ↗</a>
    </footer>

    <dialog class="lightbox" id="lightbox" aria-label="Fullscreen photograph">
      <div class="lightbox__stage">
        <button class="lightbox__close" type="button" aria-label="Close fullscreen photograph">
          Close <span aria-hidden="true">×</span>
        </button>

        <button class="lightbox__nav lightbox__nav--previous" type="button" aria-label="Previous photograph">
          <span aria-hidden="true">←</span>
        </button>

        <figure>
          <img src="" alt="" />
        </figure>

        <button class="lightbox__nav lightbox__nav--next" type="button" aria-label="Next photograph">
          <span aria-hidden="true">→</span>
        </button>
      </div>
    </dialog>
